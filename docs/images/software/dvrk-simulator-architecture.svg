<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 690" role="img" aria-labelledby="title description">
  <title id="title">dVRK simulator process architecture</title>
  <desc id="description">ROS clients use a ROS Python frontend. A private Unix socket connects it to a separate Newton, PyBullet, or Isaac worker. Camera video uses a separate transport.</desc>
  <defs>
    <style>text {font-family: Arial, Helvetica, sans-serif; fill: #1e293b; font-size: 15px;} .title {font-size: 18px; font-weight: bold;} .label {font-size: 14px;}</style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
  </defs>
  <rect width="920" height="690" fill="white"/>

<rect x="40" y="20" width="840" height="80" rx="10" fill="#eff6ff" stroke="#94a3b8"/>
<text x="60" y="50" class="title">ROS 2 / CRTK clients</text>
<text x="60" y="76">dvrk_python, rqt_dvrk, dvrk_system, application controllers</text>
<line x1="460" y1="100" x2="460" y2="150" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="480" y="130.0" class="label">CRTK topics</text>
<rect x="40" y="150" width="840" height="105" rx="10" fill="#eff6ff" stroke="#94a3b8"/>
<text x="60" y="180" class="title">ROS frontend — ROS Python</text>
<text x="60" y="206">Shared ArmRosInterface: validate commands and publish complete-scene snapshots</text>
<text x="60" y="229">Operating-state events and /diagnostics; no simulator engine imports</text>
<line x1="460" y1="255" x2="460" y2="325" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="480" y="295.0" class="label">Private AF_UNIX socket: commands, snapshots, events, metrics</text>
<rect x="40" y="325" width="840" height="195" rx="10" fill="#fffbeb" stroke="#94a3b8"/>
<text x="60" y="355" class="title">Simulator worker — selected engine Python</text>
<text x="60" y="381">Shared ArmController: operating state, independent arm/jaw trajectories, frame resolution</text>
<rect x="60" y="405" width="250" height="95" rx="10" fill="#f0fdf4" stroke="#94a3b8"/>
<text x="80" y="435" class="title">dvrk_newton</text>
<text x="80" y="461">Newton / Warp world</text>
<text x="80" y="484">Analytic URDF IK + fallback</text>
<rect x="335" y="405" width="250" height="95" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="355" y="435" class="title">dvrk_pybullet</text>
<text x="355" y="461">PyBullet shared world</text>
<text x="355" y="484">Kinematic joint resets</text>
<rect x="610" y="405" width="250" height="95" rx="10" fill="#faf5ff" stroke="#94a3b8"/>
<text x="630" y="435" class="title">dvrk_isaac_sim</text>
<text x="630" y="461">Isaac / USD scene</text>
<text x="630" y="484">Visual kinematic PSMs</text>
<line x1="460" y1="520" x2="460" y2="575" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<text x="480" y="552.5" class="label">Separate camera path; video does not cross the control socket</text>
<rect x="40" y="575" width="840" height="90" rx="10" fill="#f0fdfa" stroke="#94a3b8"/>
<text x="60" y="605" class="title">Video consumers</text>
<text x="60" y="631">Newton / PyBullet: GStreamer Unix-FD     |     Isaac: native RTSP</text>
<text x="60" y="654">Console displays, OpenXR headset, or another configured video client</text>
</svg>
