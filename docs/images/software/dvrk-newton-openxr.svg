<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 720" role="img" aria-labelledby="title description">
  <title id="title">Newton and OpenXR session</title>
  <desc id="description">OpenXR controller samples pass through dvrk_system and ROS to the Newton worker. Stereo video passes through the console overlay to the headset on separate Unix-FD sockets.</desc>
  <defs>
    <style>text {font-family: Arial, Helvetica, sans-serif; fill: #1e293b; font-size: 15px;} .title {font-size: 18px; font-weight: bold;} .label {font-size: 14px;}</style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
  </defs>
  <rect width="920" height="720" fill="white"/>

<rect x="40" y="20" width="840" height="80" rx="10" fill="#faf5ff" stroke="#94a3b8"/>
<text x="60" y="50" class="title">OpenXR session / headset</text>
<text x="60" y="76">sawOpenXR receives controller samples and displays stereo video</text>
<line x1="460" y1="100" x2="460" y2="150" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="480" y="130.0" class="label">Controller state and operator inputs</text>
<rect x="40" y="150" width="840" height="80" rx="10" fill="#eff6ff" stroke="#94a3b8"/>
<text x="60" y="180" class="title">dvrk_system</text>
<text x="60" y="206">MTML / MTMR interfaces and configured PSM / ECM teleoperation mappings</text>
<line x1="460" y1="230" x2="460" y2="280" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="480" y="260.0" class="label">CRTK arm commands and completed state</text>
<rect x="40" y="280" width="840" height="80" rx="10" fill="#eff6ff" stroke="#94a3b8"/>
<text x="60" y="310" class="title">Newton ROS frontend</text>
<text x="60" y="336">ROS Python; shared CRTK interface, command mailboxes, and diagnostics</text>
<line x1="460" y1="360" x2="460" y2="415" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="480" y="392.5" class="label">Private Unix-socket IPC</text>
<rect x="40" y="415" width="840" height="105" rx="10" fill="#f0fdf4" stroke="#94a3b8"/>
<text x="60" y="445" class="title">Newton worker and camera worker</text>
<text x="60" y="471">Configured patient cart + exercise; engine state and arm/jaw command execution</text>
<text x="60" y="494">Stereo video: @dvrk:simulator:stereo_source</text>
<line x1="460" y1="520" x2="460" y2="565" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<text x="480" y="547.5" class="label">Unix-FD video</text>
<rect x="40" y="565" width="840" height="105" rx="10" fill="#f0fdfa" stroke="#94a3b8"/>
<text x="60" y="595" class="title">dvrk_console stereo_display</text>
<text x="60" y="621">Console status overlay; output: @dvrk:console:stereo_overlay</text>
<text x="60" y="644">Unix-FD output goes to sawOpenXR for the headset display</text>
<path d="M 880 617 L 905 617 L 905 60 L 880 60" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
